<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Swipe to Skip</title>
  <link rel="stylesheet" href="detector.css">
</head>
<body>
  <div id="panel">
    <div id="header">
      <span id="dot" class="dot loading"></span>
      <span id="status">Loading…</span>
      <button id="collapse" title="Hide preview">–</button>
    </div>
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas" width="160" height="120"></canvas>
      <div id="flash">⏭ SKIP</div>
    </div>
    <div id="controls">
      <label class="row" title="Turn swipe detection on/off">
        <input type="checkbox" id="enabled" checked> Enabled
      </label>
      <label class="row" title="How far your hand must travel">
        Sensitivity <input type="range" id="sensitivity" min="1" max="5" step="1" value="3">
      </label>
      <button id="pick" title="Click this, then click umingle's skip button once">Pick skip button</button>
      <button id="grant" hidden>Grant camera access</button>
    </div>
  </div>
  <div id="grantPage" hidden>
    <h1>Swipe to Skip</h1>
    <p id="grantMsg">Requesting camera access…</p>
  </div>
  <script type="module" src="detector.js"></script>
</body>
</html>
